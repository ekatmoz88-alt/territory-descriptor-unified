<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Evidence-based technical documentation for the PPO PAK project, the PPO PAK information system and the Dossier Processing Workstation">
  <title>ППО ПАК / PPO PAK — Technical Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/reference-theme.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // docsify configuration
    window.$docsify = {
      name: 'ППО ПАК / PPO PAK — Technical Documentation',
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: true,
      search: {
        paths: 'auto',
        placeholder: { '/': 'Поиск по документации', '/en/': 'Search documentation' },
        noData: { '/': 'Ничего не найдено', '/en/': 'No results' }
      },
      copyCode: { buttonText: 'Копировать', successText: 'Скопировано' },
      pagination: {
        previousText: 'Предыдущая страница',
        nextText: 'Следующая страница',
        crossChapter: true
      },
      // Enable pre-rendering to avoid blank/loading state
      when: {
        ready: function() {
          // Trigger when docsify is ready - removes loading state
          var app = document.getElementById('app');
          if (app) {
            app.style.display = 'none';
          }
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/pagination.min.js"></script>
</body>
</html>
