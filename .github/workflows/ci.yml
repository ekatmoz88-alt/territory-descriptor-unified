name: Territory Descriptor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Markdown fences and disallowed content
        run: |
          python - <<'PYEOF'
          import re, pathlib, sys

          base = pathlib.Path('.')
          md_files = list(base.rglob('*.md'))

          errors = []

          # Check fenced code blocks are even
          for p in md_files:
              txt = p.read_text(encoding='utf-8', errors='replace')
              fences = len(re.findall(r'^( {0,3})```', txt, flags=re.M))
              if fences % 2 != 0:
                  errors.append(f'{p}: unbalanced code fences (count={fences})')

          # Check for disallowed local paths
          for p in md_files:
              txt = p.read_text(encoding='utf-8', errors='replace')
              if '/media/' in txt or '/home/' in txt:
                  errors.append(f'{p}: contains local path /media/ or /home/')

          # Check for old contextDiagram/containerDiagram syntax
          for p in md_files:
              txt = p.read_text(encoding='utf-8', errors='replace')
              if 'contextDiagram' in txt or 'containerDiagram' in txt:
                  errors.append(f'{p}: uses old Mermaid diagram syntax (contextDiagram/containerDiagram)')

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          else:
              print('All Markdown files passed the security checks.')
              sys.exit(0)
          PYEOF